services:
  romm:
    container_name: romm
    image: rommapp/romm:${ROMM_VERSION}
    restart: ${RESTART:-unless-stopped}
    depends_on:
      romm-mariadb:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Chicago}
      DB_HOST: romm-mariadb
      DB_PORT: ${ROMM_DB_PORT:-3306}
      DB_USER: ${ROMM_DB_USER:-romm}
      DB_NAME: ${ROMM_DB_NAME:-romm}
      DB_PASSWD: ${ROMM_DB_PASSWORD}
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY}
      OIDC_CLIENT_ID: ${ROMM_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${ROMM_OIDC_CLIENT_SECRET}
      OIDC_ENABLED: ${ROMM_OIDC_ENABLED:-true}
      OIDC_PROVIDER: ${ROMM_OIDC_PROVIDER:-authentik}
      OIDC_REDIRECT_URI: ${ROMM_OIDC_REDIRECT_URI:-https://romm.mcdade.app/api/oauth/openid}
      OIDC_SERVER_APPLICATION_URL: ${ROMM_OIDC_SERVER_APPLICATION_URL:-https://auth.mcdade.app/application/o/romm}
      DISABLE_USERPASS_LOGIN: ${ROMM_DISABLE_USERPASS_LOGIN:-false}
      IGDB_CLIENT_ID: ${ROMM_IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${ROMM_IGDB_CLIENT_SECRET}
      STEAMGRIDDB_API_KEY: ${ROMM_STEAMGRIDDB_API_KEY}
      SCREENSCRAPER_USER: ${ROMM_SCREENSCRAPER_USER}
      SCREENSCRAPER_PASSWORD: ${ROMM_SCREENSCRAPER_PASSWORD}
      RETROACHIEVEMENTS_API_KEY: ${ROMM_RETROACHIEVEMENTS_API_KEY}
      REFRESH_RETROACHIEVEMENTS_CACHE_DAYS: ${ROMM_REFRESH_RETROACHIEVEMENTS_CACHE_DAYS:-5}
      PLAYMATCH_API_ENABLED: ${ROMM_PLAYMATCH_API_ENABLED:-true}
      HLTB_API_ENABLED: ${ROMM_HLTB_API_ENABLED:-true}
      DISABLE_DOWNLOAD_ENDPOINT_AUTH: ${ROMM_DISABLE_DOWNLOAD_ENDPOINT_AUTH:-false}
      ENABLE_RESCAN_ON_FILESYSTEM_CHANGE: ${ROMM_ENABLE_RESCAN_ON_FILESYSTEM_CHANGE:-false}
      RESCAN_ON_FILESYSTEM_CHANGE_DELAY: ${ROMM_RESCAN_ON_FILESYSTEM_CHANGE_DELAY:-5}
      ENABLE_SCHEDULED_RESCAN: ${ROMM_ENABLE_SCHEDULED_RESCAN:-false}
      SCHEDULED_RESCAN_CRON: "${ROMM_SCHEDULED_RESCAN_CRON:-0 3 * * *}"
      SCAN_TIMEOUT: ${ROMM_SCAN_TIMEOUT:-14400}
      SCAN_WORKERS: ${ROMM_SCAN_WORKERS:-8}
      GUNICORN_WORKERS: ${ROMM_GUNICORN_WORKERS:-8}
    volumes:
      - ${CONTAINER_DATA}/romm/assets:/romm/assets:rw
      - ${CONTAINER_DATA}/romm/config:/romm/config:rw
      - ${CONTAINER_DATA}/romm/redis-data:/redis-data:rw
    ports:
      - "${ROMM_PORT:-8181}:8080"

  romm-mariadb:
    container_name: romm-mariadb
    image: lscr.io/linuxserver/mariadb:${ROMM_MARIADB_VERSION}
    restart: ${RESTART:-unless-stopped}
    environment:
      TZ: ${TZ:-America/Chicago}
      PUID: ${ROMM_DB_PUID:-99}
      PGID: ${ROMM_DB_PGID:-100}
      UMASK: ${ROMM_DB_UMASK:-022}
      MYSQL_ROOT_PASSWORD: ${ROMM_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: romm
      MYSQL_USER: ${ROMM_DB_USER:-romm}
      MYSQL_PASSWORD: ${ROMM_DB_PASSWORD}
    volumes:
      - ${CONTAINER_DATA}/romm/mariadb/config:/config:rw
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
