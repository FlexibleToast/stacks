##

[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time."
tags = ["system", "sync"]
config.schedule_alert = false
config.schedule = "Every day at 01:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "Global Auto Update"
description = "Pulls and auto updates Stacks and Deployments using 'poll_for_updates' or 'auto_update'."
tags = ["system", "sync"]
config.schedule_alert = false
config.schedule = "Every day at 01:15"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "Rebuild redhat-knowledge"
description = "Rebuilds the redhat-knowledge Docker image from source, pushing to Quay with auto-cleanup."
tags = ["unraid", "build", "sync"]
config.schedule_alert = false
config.schedule = "Every week on Sunday at 03:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "RunBuild", execution.params.build = "redhat-knowledge", enabled = true }
]

[[procedure.config.stage]]
name = "Stage 2"
enabled = true
executions = [
  { execution.type = "PullStack", execution.params.stack = "redhat-knowledge", execution.params.services = [], enabled = true },
  { execution.type = "DeployStackIfChanged", execution.params.stack = "redhat-knowledge", enabled = true }
]

