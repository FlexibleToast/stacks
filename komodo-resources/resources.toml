environment = """
CONTAINER_DATA = /mnt/user/appdata
PUBLIC_SERVER_URL = http://adventurelog-backend:8000
PUBLIC_URL = https://al-back.mcdade.app
FRONTEND_URL = https://al.mcdade.app
ORIGIN = https://al.mcdade.app
CSRF_TRUSTED_ORIGINS = https://adventurelog.mcdade.app,https://adventurelog-back.mcdade.app,https://al.mcdade.app,https://al-back.mcdade.app,http://kerbol-next.lan:8016,http://kerbol-next.lan:8015,http://192.168.10.20:8016
DJANGO_ADMIN_PASSWORD = [[AL_DJANGO_ADMIN_PASSWORD]]
POSTGRES_PASSWORD = [[AL_PGPASSWORD]]
SECRET_KEY = [[AL_SECRET_KEY]]
ADVENTURELOG_RESTART = no
"""

