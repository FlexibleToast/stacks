[[stack]]
name = "adguard-brookview"
description = "DNS-level ad blocker and content filter. Docs: https://adguard.com"
tags = ["brookview", "sync"]
[stack.config]
server = "Bookview MicroOS"
linked_repo = "kerbol-next"
run_directory = "adguard"
file_paths = [
  "compose.yaml",
  "brookview.ipvlan.compose.yaml"
]
environment = """
  ADGUARD_FRONTEND_IP=172.25.0.3
  ADGUARD_HOME_IP=10.10.10.2
  ADGUARD_SUBNET=10.10.10.0/24
  ADGUARD_GATEWAY=10.10.10.1
  CONTAINER_DATA=/srv/container-data
  ADGUARD_VERSION = latest
"""

