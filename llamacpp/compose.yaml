services:
  llamacpp:
    container_name: llamacpp
    image: ghcr.io/ggml-org/llama.cpp:${LLAMACPP_VERSION:-server-intel}
    restart: ${SVC_RESTART:-unless-stopped}
    command:
      - --models-preset
      - /app/model.ini
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      TZ: ${TZ:-America/Chicago}
      LLAMA_API_KEY: ${LLAMACPP_API_KEY}
      HF_HOME: /root/.cache/huggingface
      SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS: 1
    ports:
      - "${LLAMACPP_PORT:-8080}:8080"
    volumes:
      - ./model.ini:/app/model.ini:ro
      - ${CONTAINER_DATA}/llamacpp/cache:/root/.cache
    mem_limit: ${LLAMACPP_MEMORY:-64g}
