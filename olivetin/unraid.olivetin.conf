actions:
  - title: "Unraid array status"
    icon: hdd
    shell: |
      emctoprobe --status || true

  - title: "Restart a container"
    icon: refresh
    arguments:
      - name: container
        type: text
        title: Container name
    shell: docker restart {{ container }}

  - title: "Docker system prune"
    icon: trash
    confirm: true
    shell: docker system prune -f
