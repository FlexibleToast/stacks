actions:
  - title: "Setup SSH (run once)"
    icon: key
    onclick: execution-dialog
    shell: olivetin-setup-easy-ssh

  - title: "Unraid array status"
    icon: hdd
    shell: ssh -F /config/ssh/config unraid 'emctoprobe --status'

  - title: "Restart a container on Unraid"
    icon: refresh
    arguments:
      - name: container
        type: text
        title: Container name
    shell: ssh -F /config/ssh/config unraid 'docker restart {{ container }}'

  - title: "Docker system prune on Unraid"
    icon: trash
    confirm: true
    shell: ssh -F /config/ssh/config unraid 'docker system prune -f'
