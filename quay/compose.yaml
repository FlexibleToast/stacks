services:
  quay-clair-postgresql:
    container_name: quay-clair-postgresql
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Chicago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-clairuser}
      POSTGRES_DB: ${POSTGRES_DB:-clair}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-clairuser}", "-d", "${POSTGRES_DB:-clair}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ${CONTAINER_DATA}/quay-stack/clair-postgresql:/var/lib/postgresql/data:rw

  quay-clair:
    container_name: quay-clair
    image: quay.io/projectquay/clair:${CLAIR_VERSION}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Chicago}
      CLAIR_MODE: ${CLAIR_MODE:-combo}
      CLAIR_CONF: ${CLAIR_CONF:-/config/config.yaml}
    volumes:
      - ${CONTAINER_DATA}/quay-stack/clair:/config:rw
    tmpfs:
      - /tmp
    depends_on:
      quay-clair-postgresql:
        condition: service_healthy

  quay-mirror:
    image: quay.io/projectquay/quay:${QUAY_VERSION}
    deploy:
      replicas: ${QUAY_MIRROR_REPLICAS:-1}
    restart: unless-stopped
    command: repomirror
    environment:
      TZ: ${TZ:-America/Chicago}
      IGNORE_VALIDATION: ${IGNORE_VALIDATION:-true}
    volumes:
      - ${CONTAINER_DATA}/quay-stack/quay/config/:/conf/stack:rw
      - ${QUAY_STORAGE}:/datastorage:rw
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      quay:
        condition: service_healthy

  quay-postgresql:
    container_name: quay-postgresql
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Chicago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-quayuser}
      POSTGRES_DB: ${POSTGRES_DB:-quay}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-quayuser}", "-d", "${POSTGRES_DB:-quay}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ${CONTAINER_DATA}/quay-stack/quay-postgresql:/var/lib/postgresql/data:rw

  quay-redis:
    container_name: quay-redis
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Chicago}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ${CONTAINER_DATA}/quay-stack/quay-redis:/data:rw
    command:
      - --save 60 1
      - --loglevel warning
      - --requirepass ${REDIS_PASSWORD}

  quay:
    container_name: quay
    image: quay.io/projectquay/quay:${QUAY_VERSION}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Chicago}
      IGNORE_VALIDATION: ${IGNORE_VALIDATION:-true}
    volumes:
      - ${CONTAINER_DATA}/quay-stack/quay/config/:/conf/stack:rw
      - ${QUAY_STORAGE}:/datastorage:rw
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/instance"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      quay-postgresql:
        condition: service_healthy
      quay-redis:
        condition: service_healthy
