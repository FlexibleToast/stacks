services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_VERSION:-latest}
    restart: ${OPENWEBUI_RESTART:-unless-stopped}
    environment:
      TZ: ${TZ:-America/Chicago}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - "${CONTAINER_DATA}/open-webui:/app/backend/data:rw"
    mem_limit: ${OPENWEBUI_MEMORY:-5g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  searxng-ai:
    container_name: searxng-ai
    image: searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: ${SEARXNG_RESTART:-unless-stopped}
    environment:
      TZ: ${TZ:-America/Chicago}
      INSTANCE_NAME: ${INSTANCE_NAME:-}
    volumes:
      - "${CONTAINER_DATA}/searxng-ai:/etc/searxng:rw"
    tmpfs:
      - "/var/cache/searxng"

  tika:
    container_name: tika
    image: docker.io/apache/tika:${TIKA_VERSION:-latest}
    restart: ${TIKA_RESTART:-unless-stopped}
    environment:
      TZ: ${TZ:-America/Chicago}
