services:
  # paperless-ngx main service
  paperless:
    env_file: 
      - ./paperless/.env
      - ./paperless/authentik.env
    networks:
      - backend
      - frontend
  
  # postgres database for paperless-ngx
  postgres:
    networks:
      - backend
  
  # redis database for paperless-ngx
  redis:
    networks:
      - backend
  
  # gotenberg service that paperless uses for document conversion
  gotenberg:
    networks:
      - backend
  
  # tika service that paperless uses for document text extraction
  tika:
    networks:
      - backend

  # paperless-ai service
  paperless-ai:
    networks:
      - ai
      - backend
      - frontend
  
  # paperless-gpt service
  paperless-gpt:
    networks:
      - ai
      - backend
      - frontend

networks:
  ai:
    external: true
  frontend:
    external: true
  backend: