services:
  dawarich:
    container_name: dawarich
    image: freikin/dawarich:${DAWARICH_VERSION}
    restart: ${SVC_RESTART:-unless-stopped}
    depends_on:
      dawarich_db:
        condition: service_healthy
      dawarich_redis:
        condition: service_healthy
    entrypoint: web-entrypoint.sh
    command: ["bin/rails", "server", "-p", "3000", "-b", "::"]
    ports:
      - "${DAWARICH_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-America/Chicago}
      RAILS_ENV: ${DAWARICH_RAILS_ENV:-production}
      REDIS_URL: redis://dawarich_redis:6379
      DATABASE_HOST: dawarich_db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: ${DAWARICH_DB_USER:-dawarich}
      DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD}
      DATABASE_NAME: ${DAWARICH_DB_NAME:-dawarich}
      TIME_ZONE: ${TZ:-America/Chicago}
      APPLICATION_HOSTS: ${DAWARICH_APPLICATION_HOSTS}
      APPLICATION_PROTOCOL: ${DAWARICH_APPLICATION_PROTOCOL}
      SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
      RAILS_LOG_TO_STDOUT: "true"
      SELF_HOSTED: "true"
      STORE_GEODATA: "true"
      WEB_CONCURRENCY: ${DAWARICH_WEB_CONCURRENCY:-1}
    volumes:
      - ${CONTAINER_DATA}/dawarich/public:/var/app/public:rw
      - ${CONTAINER_DATA}/dawarich/watched:/var/app/tmp/imports/watched:rw
      - ${CONTAINER_DATA}/dawarich/storage:/var/app/storage:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'"]
      interval: 60s
      retries: 30
      start_period: 30s
      timeout: 10s

  dawarich-sidekiq:
    container_name: dawarich-sidekiq
    image: freikin/dawarich:${DAWARICH_VERSION}
    restart: ${SVC_RESTART:-unless-stopped}
    depends_on:
      dawarich_db:
        condition: service_healthy
      dawarich_redis:
        condition: service_healthy
    entrypoint: sidekiq-entrypoint.sh
    command: ["sidekiq"]
    environment:
      TZ: ${TZ:-America/Chicago}
      RAILS_ENV: ${DAWARICH_RAILS_ENV:-production}
      REDIS_URL: redis://dawarich_redis:6379
      DATABASE_HOST: dawarich_db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: ${DAWARICH_DB_USER:-dawarich}
      DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD}
      DATABASE_NAME: ${DAWARICH_DB_NAME:-dawarich}
      APPLICATION_HOSTS: ${DAWARICH_APPLICATION_HOSTS:-localhost,::1,127.0.0.1}
      APPLICATION_PROTOCOL: ${DAWARICH_APPLICATION_PROTOCOL:-http}
      SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
      RAILS_LOG_TO_STDOUT: "true"
      SELF_HOSTED: "true"
      STORE_GEODATA: "true"
      BACKGROUND_PROCESSING_CONCURRENCY: ${DAWARICH_BG_CONCURRENCY:-3}
    volumes:
      - ${CONTAINER_DATA}/dawarich/public:/var/app/public:rw
      - ${CONTAINER_DATA}/dawarich/watched:/var/app/tmp/imports/watched:rw
      - ${CONTAINER_DATA}/dawarich/storage:/var/app/storage:rw
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq"]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s

  dawarich_db:
    container_name: dawarich_db
    image: postgis/postgis:${DAWARICH_POSTGIS_VERSION}
    restart: ${SVC_RESTART:-unless-stopped}
    shm_size: 1G
    environment:
      TZ: ${TZ:-America/Chicago}
      POSTGRES_USER: ${DAWARICH_DB_USER:-dawarich}
      POSTGRES_PASSWORD: ${DAWARICH_DB_PASSWORD}
      POSTGRES_DB: ${DAWARICH_DB_NAME:-dawarich}
    volumes:
      - ${CONTAINER_DATA}/dawarich/postgres:/var/lib/postgresql/data:rw
      - ${CONTAINER_DATA}/dawarich/shared:/var/shared:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DAWARICH_DB_USER:-dawarich} -d ${DAWARICH_DB_NAME:-dawarich}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  dawarich_redis:
    container_name: dawarich_redis
    image: redis:${DAWARICH_REDIS_VERSION}
    restart: ${SVC_RESTART:-unless-stopped}
    command: ["redis-server", "--save", "900", "1", "--save", "300", "10", "--appendonly", "no"]
    volumes:
      - ${CONTAINER_DATA}/dawarich/shared:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
