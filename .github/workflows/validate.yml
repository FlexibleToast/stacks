name: Validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run validation
        run: ./scripts/validate.py
        env:
          PR_BASE: ${{ github.base_ref }}
          GIT_BASE: ${{ github.event.before }}

  sync:
    needs: validate
    if: github.event_name == 'push' && github.event.head_commit.author.name != 'komodo'
    runs-on: ubuntu-latest
    steps:
      - name: Sync Komodo resources
        env:
          KOMODO_API_BASE: ${{ vars.KOMODO_API_BASE }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          curl -s -f -X POST "${KOMODO_API_BASE}/execute/RunSync" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${KOMODO_API_KEY}" \
            -H "X-Api-Secret: ${KOMODO_API_SECRET}" \
            -d '{"sync": "Github"}'

  deploy:
    needs: [validate, sync]
    if: github.event_name == 'push' && github.event.head_commit.author.name != 'komodo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trigger affected stacks
        run: ./scripts/deploy.py
        env:
          GIT_BASE: ${{ github.event.before }}
          KOMODO_API_BASE: ${{ vars.KOMODO_API_BASE }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
