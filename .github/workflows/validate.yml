name: Validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run validation
        run: ./scripts/validate.py
        env:
          PR_BASE: ${{ github.base_ref }}

  deploy:
    needs: [validate, sync]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trigger affected stacks
        run: ./scripts/deploy.py
        env:
          GIT_BASE: ${{ github.event.before }}
          KOMODO_API_BASE: ${{ vars.KOMODO_API_BASE }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}

  sync:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Sync Komodo resources
        env:
          KOMODO_API_BASE: ${{ vars.KOMODO_API_BASE }}
          KOMODO_SYNC_ID: ${{ vars.KOMODO_SYNC_ID }}
        run: |
          curl -s -X POST "${KOMODO_API_BASE}/listener/github/sync/${KOMODO_SYNC_ID}/sync"
